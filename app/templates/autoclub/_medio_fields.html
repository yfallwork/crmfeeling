<div class="mb-3">
  <label class="form-label fw-semibold text-sm">Nombre <span class="text-danger">*</span></label>
  <input type="text" name="nombre" class="form-control" placeholder="Ej: Juan García" required>
</div>
<div class="mb-3">
  <label class="form-label fw-semibold text-sm">Medio / Publicación</label>
  <input type="text" name="medio" class="form-control" placeholder="Ej: AS Motor, Rallye Magazine…">
</div>
<div class="mb-3">
  <label class="form-label fw-semibold text-sm">Email <span class="text-danger">*</span></label>
  <input type="email" name="email" class="form-control" required>
</div>
<div>
  <label class="form-label fw-semibold text-sm">Notas <span class="text-muted fw-normal">(opcional)</span></label>
  <textarea name="notas" class="form-control" rows="2" style="resize:none"
            placeholder="Sección de motor, colaborador habitual…"></textarea>
</div>
