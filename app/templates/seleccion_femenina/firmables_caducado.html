<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Enlace caducado — Selección Femenina de Pilotos</title>
<style>
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:#F3F4F6;color:#0D0D0D;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:14px;padding:40px 32px;max-width:440px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.08);border-top:4px solid #AD1726}
.ico{width:60px;height:60px;border-radius:50%;background:#fde8ea;color:#AD1726;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px}
h1{font-size:1.25rem;margin:0 0 10px}
p{color:#444;font-size:.95rem;line-height:1.6}
</style>
</head>
<body>
  <div class="card">
    <div class="ico">!</div>
    <h1>Este enlace ha caducado</h1>
    <p>El enlace de autorizaciones de <strong>{{ preinscripcion.nombre_completo }}</strong> ya no está disponible.</p>
    <p>Ponte en contacto con la organización para que te enviemos uno nuevo.</p>
  </div>
</body>
</html>
