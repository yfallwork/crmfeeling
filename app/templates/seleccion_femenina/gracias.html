<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<title>¡Preinscripción recibida! · Selección Femenina de Pilotos de Carcross</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --pink: #AD1726; --black: #0D0D0D; --gray-600: #4B5563; }
  html, body { height: 100%; }
  body {
    min-height: 100svh; min-height: 100vh;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background:
      linear-gradient(180deg, rgba(13,13,13,.55) 0%, rgba(13,13,13,.9) 65%, var(--black) 100%),
      repeating-linear-gradient(135deg, #000 0 26px, #161616 26px 52px);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(1.25rem, 5vw, 2.5rem);
    padding-top: calc(clamp(1.25rem, 5vw, 2.5rem) + env(safe-area-inset-top));
    padding-bottom: calc(clamp(1.25rem, 5vw, 2.5rem) + env(safe-area-inset-bottom));
  }
  .card {
    max-width: 480px; width: 100%; background: #fff; color: var(--black);
    border-radius: 22px; padding: clamp(2rem, 6vw, 3rem) clamp(1.5rem, 5vw, 2.5rem);
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .ico {
    width: 72px; height: 72px; border-radius: 50%; background: var(--pink); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 2rem;
    margin: 0 auto clamp(1rem, 3vw, 1.5rem);
  }
  h1 { font-size: clamp(1.4rem, 4vw, 1.8rem); font-weight: 800; margin-bottom: .6em; letter-spacing: -.02em; }
  p { color: var(--gray-600); font-size: clamp(.95rem, 2vw, 1.05rem); line-height: 1.6; margin-bottom: .8em; }
  .btn {
    display: inline-flex; align-items: center; gap: .5em; min-height: 50px;
    padding: .85em 1.6em; border-radius: 100px; background: var(--black); color: #fff;
    text-decoration: none; font-weight: 700; margin-top: 1rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="ico"><i class="bi bi-check-lg"></i></div>
    <h1>¡Preinscripción recibida!</h1>
    <p>Gracias por dar el paso. Hemos registrado tus datos correctamente.</p>
    <p>Si tu perfil encaja con lo que buscamos, nos pondremos en contacto contigo con toda la información sobre la ponencia inaugural y las entrevistas.</p>
    <a href="{{ url_for('seleccion_femenina.landing') }}" class="btn"><i class="bi bi-arrow-left"></i>Volver a la página</a>
  </div>
</body>
</html>
